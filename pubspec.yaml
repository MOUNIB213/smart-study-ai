name: smart_study_ai
description: تطبيق مساعد دراسي ذكي يعمل محلياً لتصوير الدروس ورفع الملفات وإنشاء الملخصات والخرائط الذهنية والكويزات والامتحانات مع محادثة ذكية.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  syncfusion_flutter_pdf: ^27.2.2
  google_generative_ai: ^0.4.6
  gpt_markdown: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
